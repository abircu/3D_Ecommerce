<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070708" />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var saved = localStorage.getItem('aether-theme')
          var theme = q === 'light' || q === 'dark'
            ? q
            : saved === 'light' || saved === 'dark'
              ? saved
              : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.content = theme === 'light' ? '#f4f0e6' : '#070708'
        } catch (e) {}
      })()
    </script>
    <meta
      name="description"
      content="VELORA — modern clothing store with interactive 3D. Organic cotton tees, outerwear and streetwear."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>VELORA — Wear the Motion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
